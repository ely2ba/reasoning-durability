[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-durability"
version = "0.1.0"
description = "Reasoning trained on repeated solutions breaks under later fine-tuning: data, frozen outputs and analysis"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = ["numpy==2.5.1", "pandas==3.0.5", "matplotlib==3.11.1"]

[project.optional-dependencies]
experiments = ["tinker==0.25.0", "tinker-cookbook==0.5.3", "transformers==5.5.4", "tokenizers==0.22.2", "pyarrow==25.0.0"]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*"]

[tool.pytest.ini_options]
markers = ["duraseed: needs data outside this repository (the original DuraSeed-v1 runs, inputs/ or the Hugging Face cache); skipped when it is absent"]
